
plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.9.4" 
    id "com.squareup.wire" version "5.3.1"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

// The --dart-define values of the build, which flutter hands to gradle base64 encoded.
def dartDefines = (project.findProperty('dart-defines') ?: '').toString().split(',')
        .findAll { it }
        .collect { new String(it.decodeBase64(), 'UTF-8') }
// Google Play updates the app itself, so its build does not ask to install packages.
def isGooglePlay = dartDefines.contains('release=google-play')

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')?: '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.hiddify.hiddify'
    testNamespace "test.com.hiddify.hiddify"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "app.hiddify.com"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        manifestPlaceholders += [
            installPackagesPermission: isGooglePlay ? 'android.permission.INTERNET' : 'android.permission.REQUEST_INSTALL_PACKAGES'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Android TV build for the Xiaomi Mi Stick 4K: its userspace is 32-bit, so the release APK
    // carries the 32-bit ARM engine and core only (no splits, no universal APK). Phones, x86 and
    // arm64 are out of scope of this build.

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            ndk {
                // The Flutter plugin adds every ABI it knows to each build type; keep only the
                // 32-bit ARM one this TV build targets.
                //noinspection ChromeOsAbiSupport
                abiFilters.clear()
                abiFilters "armeabi-v7a"
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    packaging {
        jniLibs {
            // store native libs (mainly the Go core) compressed in the APK; Android extracts them
            // at install. Much smaller download, slightly larger installed size and install time.
            useLegacyPackaging = true
        }
    }

}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
//    protoPath(project(':hiddify_api'))
//    implementation project(':hiddify_api')

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'io.grpc:grpc-okhttp:1.64.0'
    androidTestImplementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    androidTestImplementation 'io.grpc:grpc-stub:1.64.0'
}
