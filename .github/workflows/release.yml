name: Release ProxyYou
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия, например v4.1.18 (должна совпадать с pubspec.yaml)'
        required: true
        type: string
      operation:
        description: 'Создать черновик или опубликовать проверенный черновик'
        required: true
        type: choice
        options: [prepare, publish]
      artifacts_verified:
        description: 'Для публикации: файлы проверены, статус подписей указан в описании'
        type: boolean
        default: false
      include_macos:
        description: 'Включить macOS Apple Silicon; выключите для выпуска только Android и Windows'
        type: boolean
        default: true
      include_windows:
        description: 'Включить Windows x64'
        type: boolean
        default: true
      windows_only:
        description: 'Выпустить только Windows x64'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-proxyyou
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      OPERATION: ${{ inputs.operation }}
      ARTIFACTS_VERIFIED: ${{ inputs.artifacts_verified }}
      INCLUDE_MACOS: ${{ inputs.include_macos }}
      INCLUDE_WINDOWS: ${{ inputs.include_windows }}
      WINDOWS_ONLY: ${{ inputs.windows_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify version and release policy
        run: |
          python3 scripts/github_release.py preflight
      - name: Create draft release
        if: inputs.operation == 'prepare'
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "PROXYYOU ${RELEASE_TAG#v}" --notes 'Черновик: загрузите проверенные пакеты выбранных платформ и SHA256SUMS.txt. Публикация выполняется workflow Release ProxyYou.'
      - name: Verify and publish existing draft
        if: inputs.operation == 'publish'
        run: |
          python3 scripts/github_release.py verify-draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Refresh published download page
        if: inputs.operation == 'publish'
        run: gh workflow run pages.yml --ref main
