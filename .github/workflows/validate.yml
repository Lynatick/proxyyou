name: Validate ProxyYou
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    # ARM hosted capacity can leave validation unassigned until GitHub cancels it.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply documented macOS AOT workaround to isolated CI SDK
        run: python3 scripts/prepare-flutter-macos-sdk.py --sdk "$FLUTTER_ROOT"
      - name: Dependencies and generated sources
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build
      - name: Generate isolated localhost certificates
        run: bash scripts/generate-test-certificates.sh
      - name: Static analysis
        run: flutter analyze
      - name: Flutter tests
        # These unit tests do not load the Go core. Give the native-asset loader
        # a test-only SQLite provider; actual shared-core interop is tested on
        # the local release cores, not claimed by this CI job.
        run: |
          mkdir -p "$RUNNER_TEMP/unit-sqlite"
          ln -s /usr/lib/libsqlite3.dylib "$RUNNER_TEMP/unit-sqlite/hiddify-core.dylib"
          # Invoke the snapshot directly: macOS strips DYLD_* when launching
          # Flutter's /usr/bin/env shell entrypoint.
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/unit-sqlite" "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot" test --concurrency=1
      - name: Video playback proof tests
        run: node --test test/playback/proof.test.cjs
      - name: Download page tests
        run: node --test test/site/downloads.test.mjs
      - name: Release platform and checksum checks
        run: python3 -m unittest discover -s test/release -p '*_test.py'
